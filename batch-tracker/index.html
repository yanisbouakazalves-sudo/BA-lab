<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BA Labs — Culture Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172018;
      background: #f4f6f3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #657066;
    }

    .card {
      background: white;
      border: 1px solid #dfe5df;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 600;
    }

    select,
    input,
    textarea,
    button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      border: 1px solid #ccd5cc;
      font: inherit;
    }

    select,
    input,
    textarea {
      background: #fff;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #183b24;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #245a35;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .info {
      background: #f5f7f5;
      border-radius: 9px;
      padding: 12px;
      margin-top: 12px;
    }

    .success {
      background: #edf8ef;
      border: 1px solid #b8dfbe;
      color: #1d5a29;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #e5bcbc;
      color: #8a2020;
    }

    .muted {
      color: #69736b;
      font-size: 14px;
    }

    code {
      background: #eef1ee;
      padding: 2px 5px;
      border-radius: 4px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <h1>BA Labs — Culture Tracker</h1>
    <div class="subtitle">
      Création d'une culture avec génération automatique du matériel dérivé.
    </div>
  </header>

  <div id="message"></div>

  <section class="card">
    <h2>Nouvelle culture</h2>

    <label for="strain">Souche / ressource biologique</label>
    <select id="strain">
      <option value="">Chargement...</option>
    </select>

    <div id="strainInfo" class="info muted">
      Sélectionnez une souche.
    </div>

    <label for="cultureCode">Code de culture</label>
    <input
      id="cultureCode"
      type="text"
      placeholder="Ex. CULT-PO-P80-001"
    >

    <div class="grid">

      <div>
        <label for="cultureType">Type de culture</label>
        <select id="cultureType">
          <option value="">Chargement...</option>
        </select>
      </div>

      <div>
        <label for="protocol">Protocole</label>
        <select id="protocol">
          <option value="">Chargement...</option>
        </select>
      </div>

    </div>

    <label for="startedAt">Date de démarrage</label>
    <input id="startedAt" type="datetime-local">

    <div id="generationInfo" class="info">
      Génération : —
    </div>

    <button id="createButton">
      Créer la culture
    </button>
  </section>

  <section class="card">
    <h2>Résultat</h2>

    <div id="result" class="muted">
      Aucune culture créée pour le moment.
    </div>
  </section>

</div>

<script>
/* ============================================================
   BA LABS — SUPABASE CONFIGURATION
   ============================================================ */

const SUPABASE_URL =
  "https://axcouwiodqsauwnsiotn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_8H4XRh8V07Hlo0WwdfOXwg_2RXRX992";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ============================================================
   GLOBAL STATE
   ============================================================ */

let organizationId = null;
let strainOptions = [];
let referenceData = [];


/* ============================================================
   DOM
   ============================================================ */

const strainSelect =
  document.getElementById("strain");

const cultureTypeSelect =
  document.getElementById("cultureType");

const protocolSelect =
  document.getElementById("protocol");

const cultureCodeInput =
  document.getElementById("cultureCode");

const startedAtInput =
  document.getElementById("startedAt");

const generationInfo =
  document.getElementById("generationInfo");

const strainInfo =
  document.getElementById("strainInfo");

const createButton =
  document.getElementById("createButton");

const result =
  document.getElementById("result");

const message =
  document.getElementById("message");


/* ============================================================
   HELPERS
   ============================================================ */

function showMessage(text, type = "success") {
  message.innerHTML = "";

  const div = document.createElement("div");
  div.className = `card ${type}`;
  div.textContent = text;

  message.appendChild(div);
}

function clearMessage() {
  message.innerHTML = "";
}

function escapeHtml(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ============================================================
   LOAD BA LABS ORGANIZATION
   ============================================================ */

async function loadOrganization() {

  const { data, error } =
    await supabaseClient
      .from("organizations")
      .select("id, code, name")
      .eq("code", "BA-LABS")
      .maybeSingle();

  if (error) {
    throw error;
  }

  if (!data) {
    throw new Error(
      "Organisation BA-LABS introuvable dans Supabase."
    );
  }

  organizationId = data.id;
}


/* ============================================================
   LOAD CULTURE CREATION OPTIONS
   ============================================================ */

async function loadStrainOptions() {

  const { data, error } =
    await supabaseClient
      .from("v_culture_creation_options")
      .select(`
        organization_id,
        material_id,
        material_code,
        generation,
        material_state,
        strain_id,
        strain_code,
        strain_designation,
        organism_id,
        scientific_name,
        common_name
      `)
      .eq("organization_id", organizationId)
      .order("strain_code");

  if (error) {
    throw error;
  }

  strainOptions = data || [];

  strainSelect.innerHTML =
    '<option value="">Sélectionner une souche...</option>';

  for (const item of strainOptions) {

    const option =
      document.createElement("option");

    option.value = item.material_id;

    option.textContent =
      `${item.strain_code} — ${item.strain_designation || item.scientific_name}`;

    strainSelect.appendChild(option);
  }

  updateGenerationPreview();
}


/* ============================================================
   LOAD REFERENCE DATA
   ============================================================ */

async function loadReferenceData() {

  const { data, error } =
    await supabaseClient
      .from("v_culture_creation_reference")
      .select("*")
      .order("reference_type")
      .order("code");

  if (error) {
    throw error;
  }

  referenceData = data || [];

  loadCultureTypes();
  loadProtocols();
}


/* ============================================================
   CULTURE TYPES
   ============================================================ */

function loadCultureTypes() {

  cultureTypeSelect.innerHTML =
    '<option value="">Sélectionner...</option>';

  const types =
    referenceData.filter(
      row => row.reference_type === "culture_type"
    );

  for (const item of types) {

    const option =
      document.createElement("option");

    option.value = item.code;

    option.textContent =
      item.label || item.code;

    cultureTypeSelect.appendChild(option);
  }
}


/* ============================================================
   PROTOCOLS
   ============================================================ */

function loadProtocols() {

  protocolSelect.innerHTML =
    '<option value="">Aucun / sélectionner...</option>';

  const protocols =
    referenceData.filter(
      row => row.reference_type === "protocol"
    );

  for (const item of protocols) {

    const option =
      document.createElement("option");

    option.value = item.code;

    option.textContent =
      `${item.code} — ${item.name}`;

    protocolSelect.appendChild(option);
  }
}


/* ============================================================
   GENERATION PREVIEW
   ============================================================ */

function updateGenerationPreview() {

  const materialId =
    strainSelect.value;

  const selected =
    strainOptions.find(
      item => item.material_id === materialId
    );

  if (!selected) {

    strainInfo.textContent =
      "Sélectionnez une souche.";

    generationInfo.textContent =
      "Génération : —";

    return;
  }

  strainInfo.innerHTML = `
    <strong>${escapeHtml(selected.strain_code)}</strong><br>
    Organisme :
    ${escapeHtml(selected.scientific_name || "—")}<br>
    Désignation :
    ${escapeHtml(selected.strain_designation || "—")}<br>
    Matériel parent :
    <code>${escapeHtml(selected.material_code)}</code><br>
    Génération actuelle :
    <strong>G${selected.generation}</strong>
  `;

  const nextGeneration =
    Number(selected.generation) + 1;

  generationInfo.innerHTML = `
    Matériel parent :
    <code>${escapeHtml(selected.material_code)}</code>
    →
    nouvelle culture :
    <strong>G${nextGeneration}</strong>
  `;
}


/* ============================================================
   CREATE CULTURE
   ============================================================ */

async function createCulture() {

  clearMessage();

  const materialId =
    strainSelect.value;

  const cultureCode =
    cultureCodeInput.value.trim();

  const cultureType =
    cultureTypeSelect.value;

  const protocolCode =
    protocolSelect.value;

  const startedAt =
    startedAtInput.value;

  if (!materialId) {
    showMessage(
      "Sélectionnez une souche.",
      "error"
    );
    return;
  }

  if (!cultureCode) {
    showMessage(
      "Entrez un code de culture.",
      "error"
    );
    return;
  }

  if (!cultureType) {
    showMessage(
      "Sélectionnez un type de culture.",
      "error"
    );
    return;
  }

  let protocolVersionId = null;

  /*
   * Si un protocole est sélectionné,
   * récupérer sa version 1.0.
   */

  if (protocolCode) {

    const { data, error } =
      await supabaseClient
        .from("protocols")
        .select("id")
        .eq("organization_id", organizationId)
        .eq("code", protocolCode)
        .maybeSingle();

    if (error) {
      showMessage(
        `Erreur protocole : ${error.message}`,
        "error"
      );
      return;
    }

    if (data) {

      const { data: version, error: versionError } =
        await supabaseClient
          .from("protocol_versions")
          .select("id")
          .eq("organization_id", organizationId)
          .eq("protocol_id", data.id)
          .eq("version", "1.0")
          .maybeSingle();

      if (versionError) {
        showMessage(
          `Erreur version protocole : ${versionError.message}`,
          "error"
        );
        return;
      }

      if (version) {
        protocolVersionId = version.id;
      }
    }
  }


  /* ----------------------------------------------------------
     CREATE THROUGH RPC
     ---------------------------------------------------------- */

  createButton.disabled = true;
  createButton.textContent = "Création...";

  try {

    const { data, error } =
      await supabaseClient.rpc(
        "create_culture_with_generation",
        {
          p_organization_id: organizationId,

          p_code: cultureCode,

          p_culture_type: cultureType,

          p_parent_material_id: materialId,

          p_parent_culture_id: null,

          p_protocol_version_id:
            protocolVersionId,

          p_environment_id: null,

          p_experiment_id: null,

          p_experimental_unit_id: null,

          p_started_at:
            startedAt
              ? new Date(startedAt).toISOString()
              : null,

          p_metadata: {
            source: "BA Labs Culture Tracker",
            interface_version: "1.0"
          }
        }
      );


    if (error) {
      throw error;
    }


    /* --------------------------------------------------------
       RPC RESULT
       -------------------------------------------------------- */

    result.className = "success";

    result.innerHTML = `
      <strong>Culture créée.</strong>

      <br><br>

      <strong>Culture :</strong>
      <code>${escapeHtml(data.culture_code || cultureCode)}</code>

      <br>

      <strong>Matériel dérivé :</strong>
      <code>${escapeHtml(data.material_code || "—")}</code>

      <br>

      <strong>Génération :</strong>
      G${escapeHtml(data.generation ?? "—")}

      <br>

      <strong>ID culture :</strong>
      <code>${escapeHtml(data.culture_id || "—")}</code>

      <br>

      <strong>ID matériel :</strong>
      <code>${escapeHtml(data.material_id || "—")}</code>
    `;

    showMessage(
      "La culture et son matériel dérivé ont été créés dans Supabase."
    );

    cultureCodeInput.value = "";

    await loadStrainOptions();

  } catch (error) {

    console.error(error);

    result.className = "error";

    result.innerHTML = `
      <strong>Erreur</strong><br><br>
      ${escapeHtml(error.message || String(error))}
    `;

    showMessage(
      error.message ||
      "La création de la culture a échoué.",
      "error"
    );

  } finally {

    createButton.disabled = false;
    createButton.textContent =
      "Créer la culture";
  }
}


/* ============================================================
   EVENTS
   ============================================================ */

strainSelect.addEventListener(
  "change",
  updateGenerationPreview
);

createButton.addEventListener(
  "click",
  createCulture
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

  try {

    await loadOrganization();

    await loadStrainOptions();

    await loadReferenceData();

    /*
     * Date actuelle par défaut.
     */

    const now =
      new Date();

    now.setMinutes(
      now.getMinutes() -
      now.getTimezoneOffset()
    );

    startedAtInput.value =
      now.toISOString()
        .slice(0, 16);

  } catch (error) {

    console.error(error);

    showMessage(
      `Initialisation impossible : ${error.message}`,
      "error"
    );
  }
}

init();

</script>

</body>
</html>
